name: Real pretrained DINOv3 - SleepEEG to Epilepsy smoke run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-dinov3:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Hugging Face access secret
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Add a GitHub Actions repository secret named HF_TOKEN. A Hugging Face approval alone does not authenticate GitHub Actions."
            exit 1
          fi
      - name: Install PyTorch CPU and DINOv3 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r code/TFC/requirements-dinov3.txt matplotlib
      - name: Download real public SleepEEG and Epilepsy datasets
        run: python code/TFC/download_real_benchmarks.py
      - name: Check dataset tensors
        run: |
          python - <<'PY'
          import torch
          from pathlib import Path
          for name in ["SleepEEG/train.pt", "Epilepsy/train.pt", "Epilepsy/test.pt"]:
              path = Path("datasets") / name
              data = torch.load(path, map_location="cpu", weights_only=True)
              assert "samples" in data and "labels" in data, name
              print(name, tuple(data["samples"].shape), tuple(data["labels"].shape))
          PY
      - name: Run pretrained DINOv3 real backbone test
        working-directory: code/TFC
        run: python test_two_real_dinov3.py
      - name: Pre-train projectors for one epoch on real samples
        working-directory: code/TFC
        run: >
          python main.py --training_mode pre_train
          --pretrain_dataset SleepEEG --target_dataset Epilepsy
          --device cpu --subset --epochs 1 --seed 42
      - name: Fine-tune and evaluate held-out Epilepsy test
        working-directory: code/TFC
        run: >
          python main.py --training_mode fine_tune_test
          --pretrain_dataset SleepEEG --target_dataset Epilepsy
          --device cpu --subset --epochs 1 --seed 42
      - name: Print measured test metrics
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          reports = list(Path("code/experiments_logs").rglob("evaluation.json"))
          if not reports:
              raise SystemExit("Training finished without evaluation.json")
          for path in reports:
              print(path)
              print(json.dumps(json.loads(path.read_text()), indent=2))
          PY
      - name: Upload evaluation outputs and logs (not checkpoints)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-dinov3-one-epoch-results
          if-no-files-found: warn
          retention-days: 7
          path: |
            code/experiments_logs/**/*.json
            code/experiments_logs/**/*.csv
            code/experiments_logs/**/*.png
            code/experiments_logs/**/*.log
