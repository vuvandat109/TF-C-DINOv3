name: Validate TF-C DINOv3 pipeline

on:
  push:
    branches: [main]
    paths:
      - 'code/TFC/**'
      - '.github/workflows/validate-dinov3.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: code/TFC/requirements-dinov3.txt
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy scikit-learn matplotlib
      - name: Syntax check
        run: python -m compileall -q code/TFC
      - name: Run loss tests
        working-directory: code/TFC
        run: python test_dinov3_loss.py
      - name: Run simulated backbone test
        working-directory: code/TFC
        run: python smoke_test_dinov3.py
      - name: Run data split and evaluation regression tests
        working-directory: code/TFC
        run: python -m unittest test_validated_pipeline.py -v
